# The plugin harness's `snaptrade` service, this plugin as `make e2e` runs
# it: the harness's own README offers an override of a plugin's service, by
# its instance name, for whatever a plugin needs. The harness restarts it on
# failure itself, as a deployment's pod does, so nothing here says so.
#
# Its root read-only and /tmp writable, as the chart's pod has them (an
# emptyDir at /tmp). SnapTrade's raw responses go to the storage the harness
# grants a custody plugin (decisions/028), not to /tmp (src/snaptrade/raw.py).
services:
  snaptrade:
    read_only: true
    tmpfs:
      - /tmp:uid=65532,gid=65532,mode=1777
