# The canary: `make e2e` against the runtime's `latest` rather than the image
# the Makefile pins, weekly and on request. It blocks nothing, since no push
# or pull request runs it: a red run says that moving the pin to a newer core
# will need work first, before anyone moves it. The pin moves only by a
# deliberate commit, when this plugin chooses.
#
# A newer core may speak a newer contract than the SDK this plugin pins, and
# its sidecar then refuses the plugin; that is this run's news too.
name: e2e-latest

on:
  schedule:
    # Mondays, 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-latest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: make e2e RUNTIME_IMAGE=ghcr.io/open-meridian/meridian-runtime:latest
        run: make e2e RUNTIME_IMAGE=ghcr.io/open-meridian/meridian-runtime:latest
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-latest-logs
          path: .e2e/*.log
          if-no-files-found: ignore
